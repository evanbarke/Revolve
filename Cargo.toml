[package]
name = "revolve"
version = "0.1.0"
edition = "2024"
# MSRV: tested on 1.94.1 (Windows x86_64 dev host) and 1.95.0 (Jetson aarch64).
# The floor feature is std::fs::File::try_lock (stable since 1.89).
rust-version = "1.94"
description = "Revolve: an explicit-intent execution runtime prototype (Action IR, compiler, recoverable executor, simulator)."
license = "UNLICENSED"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive", "env"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tiny_http = "0.12.0"
ureq = "3.4.2"
# OS randomness for the LAN access key (already in the dependency tree).
getrandom = "0.2.17"
# Plan programs: generated as WebAssembly, compiled to native code by Cranelift.
# wasmtime 47 is the newest release whose MSRV (1.94) matches this crate's.
wasm-encoder = "0.259.0"
wasmtime = { version = "47.0.4", default-features = false, features = ["cranelift", "runtime", "std"] }
# Rigid-body physics for the robot cell: gravity, contacts, solid walls. Bit-for-bit
# deterministic across x86_64 and aarch64 (enhanced-determinism), so a command
# gives the same result on Windows and the Jetson, and on replay.
rapier3d-f64 = { version = "0.36.0", default-features = false, features = ["dim3", "f64", "std", "enhanced-determinism"] }

[dev-dependencies]
wat = "1"

# The physics engine is slow unoptimised; tests simulate many falls.
[profile.dev.package.rapier3d-f64]
opt-level = 3
[profile.dev.package.parry3d-f64]
opt-level = 3
[profile.dev.package.glam]
opt-level = 3
[profile.dev.package.glamx]
opt-level = 3
[profile.dev.package.simba]
opt-level = 3
[profile.dev.package.nalgebra]
opt-level = 3

[profile.release]
# Smaller, faster binary for the Jetson; no debug info in release artifacts.
codegen-units = 4
lto = "thin"
strip = "debuginfo"
