# nginx site for revolve.samix-technology.com (mailcow's nginx on the proxy host:
# ~/mailcow-dockerized/data/conf/nginx/00-revolve.conf). A template: the access
# key and the password file are filled in on the host, never committed.
#
# People authenticate here (basic auth, over HTTPS only); nginx then adds the
# Revolve access key and forwards to the Jetson, which only accepts private
# peers, this host name, and actions from exactly this https origin.

limit_req_zone $binary_remote_addr zone=revolve_rl:10m rate=20r/s;

server {
    listen 80;
    server_name revolve.samix-technology.com;

    # ACME challenge for Let's Encrypt
    location ^~ /.well-known/acme-challenge/ {
        alias /web/.well-known/acme-challenge/;
    }

    # Never serve the app or the password prompt over plain HTTP
    location / {
        return 301 https://revolve.samix-technology.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name revolve.samix-technology.com;

    ssl_certificate /etc/letsencrypt/live/revolve.samix-technology.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/revolve.samix-technology.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    auth_basic "Revolve";
    auth_basic_user_file /etc/nginx/conf.d/revolve.htpasswd;
    limit_req zone=revolve_rl burst=60 nodelay;
    client_max_body_size 128k;

    location / {
        proxy_pass http://192.168.1.104:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The proxy vouches for people who passed the password: it adds the key.
        proxy_set_header X-Revolve-Key "__REVOLVE_KEY__";
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    access_log /var/log/nginx/revolve.samix-technology.com.access.log;
    error_log /var/log/nginx/revolve.samix-technology.com.error.log;
}
